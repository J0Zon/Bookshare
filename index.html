<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>BookShare - ร้านหนังสือ &amp; เช่ายืมออนไลน์</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'earth-bg': '#F8F3EC',
            'earth-primary': '#4A3528',
            'earth-accent': '#BC6C25',
            'earth-sage': '#588157',
            'earth-sage-light': '#EAF2E8',
            'earth-sage-dark': '#2F5930',
            'earth-text': '#382B24',
            'earth-muted': '#8D7B68',
            'earth-border': '#EADBCE'
          },
          fontFamily: {
            'cute': ['Mali', 'cursive'],
            'body': ['Kanit', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    body { font-family: 'Kanit', sans-serif; background-color: #F8F3EC; color: #382B24; }
    h1, h2, h3, .font-cute { font-family: 'Mali', cursive; }
  </style>
</head>
<body class="bg-earth-bg text-earth-text antialiased">

  <!-- Header Navigation -->
  <header class="sticky top-0 z-40 bg-earth-bg/95 backdrop-blur border-b border-earth-border">
    <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3 cursor-pointer" onclick="showView('home')">
        <span class="material-symbols-outlined text-4xl text-earth-accent">menu_book</span>
        <div class="flex flex-col leading-tight">
          <span class="font-cute text-2xl font-bold text-earth-primary">BookShare</span>
          <span class="text-xs text-earth-muted">ร้านหนังสือ &amp; เช่ายืมออนไลน์</span>
        </div>
      </div>

      <nav class="flex items-center gap-6 font-medium text-sm">
        <button onclick="showView('home')" class="text-earth-primary font-bold">หน้าแรก</button>
        <button onclick="showView('seller-add')" class="text-earth-muted hover:text-earth-primary">ลงทะเบียนหนังสือใหม่</button>
      </nav>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-7xl mx-auto px-4 py-6">

    <!-- VIEW 1: HOME PAGE -->
    <div id="view-home" class="space-y-6">
      <div class="flex flex-wrap gap-2" id="category-pills"></div>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6" id="book-grid"></div>
    </div>

    <!-- VIEW 2: BOOK DETAIL -->
    <div id="view-detail" class="hidden space-y-6">
      <button onclick="showView('home')" class="px-4 py-2 bg-white border border-earth-border rounded-xl text-xs font-bold text-earth-primary">
        ← กลับหน้าหลัก
      </button>

      <div class="bg-white rounded-3xl p-6 border border-earth-border grid grid-cols-1 md:grid-cols-12 gap-8">
        <div class="md:col-span-5">
          <img id="detail-img" src="" class="w-full h-80 object-contain rounded-2xl bg-earth-bg border border-earth-border p-2"/>
        </div>
        <div class="md:col-span-7 space-y-4">
          <span id="detail-badge" class="px-3 py-1 rounded-full text-xs font-bold bg-earth-sage-light text-earth-sage-dark"></span>
          <h2 id="detail-title" class="text-2xl font-bold text-earth-primary"></h2>
          <p id="detail-author" class="text-xs text-earth-muted"></p>
          <p id="detail-desc" class="text-sm bg-earth-bg p-4 rounded-xl border border-earth-border"></p>
          
          <div id="action-container" class="pt-4"></div>
        </div>
      </div>
    </div>

    <!-- VIEW 3: ADD NEW BOOK FORM -->
    <div id="view-seller-add" class="hidden space-y-6">
      <h2 class="text-2xl font-bold text-earth-primary flex items-center gap-2">
        <span class="material-symbols-outlined text-earth-accent">add_photo_alternate</span> ลงทะเบียนหนังสือใหม่เข้าสู่ระบบ
      </h2>

      <div class="bg-white rounded-3xl p-6 border border-earth-border grid grid-cols-1 md:grid-cols-12 gap-8">
        <!-- Photo Upload Section -->
        <div class="md:col-span-5 space-y-4">
          <label class="block text-sm font-bold text-earth-primary">อัปโหลดรูปภาพหนังสือจริง *</label>
          
          <div class="border-2 border-dashed border-earth-border bg-earth-bg p-6 rounded-2xl text-center cursor-pointer hover:border-earth-accent transition">
            <input type="file" id="file-input" accept="image/*" onchange="handleFileUpload(event)" class="hidden"/>
            <label for="file-input" class="cursor-pointer space-y-2 block">
              <span class="material-symbols-outlined text-4xl text-earth-muted">cloud_upload</span>
              <p class="text-xs font-bold text-earth-primary">คลิกเลือกรูปภาพหนังสือจากเครื่อง</p>
              <p class="text-[10px] text-earth-muted">รองรับ JPG, PNG, WEBP</p>
            </label>
          </div>

          <!-- Preview Container -->
          <div id="preview-box" class="hidden space-y-2">
            <span class="text-xs font-bold text-earth-sage">✓ พรีวิวภาพถ่ายจริง:</span>
            <img id="uploaded-preview" src="" class="w-full h-64 object-cover rounded-xl border border-earth-border shadow-sm"/>
          </div>
        </div>

        <!-- Book Info Form -->
        <div class="md:col-span-7 space-y-4">
          <div>
            <label class="block text-xs font-bold text-earth-primary mb-1">ชื่อหนังสือ *</label>
            <input type="text" id="input-title" placeholder="เช่น สุขุม ละเมียด ละไม (Wabi Sabi)" class="w-full px-4 py-2 border border-earth-border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-earth-accent"/>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-earth-primary mb-1">ผู้แต่ง *</label>
              <input type="text" id="input-author" placeholder="ชื่อผู้แต่ง..." class="w-full px-4 py-2 border border-earth-border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-earth-accent"/>
            </div>
            <div>
              <label class="block text-xs font-bold text-earth-primary mb-1">หมวดหมู่ *</label>
              <select id="input-category" class="w-full px-4 py-2 border border-earth-border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-earth-accent">
                <option value="จิตวิทยา & พัฒนาตนเอง">จิตวิทยา & พัฒนาตนเอง</option>
                <option value="วรรณกรรม & นิยายแปล">วรรณกรรม & นิยายแปล</option>
                <option value="ธุรกิจ & การลงทุน">ธุรกิจ & การลงทุน</option>
                <option value="หนังสือภาพ & ไลฟ์สไตล์">หนังสือภาพ & ไลฟ์สไตล์</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-earth-primary mb-1">ราคาขายส่งต่อ (฿)</label>
              <input type="number" id="input-buy-price" value="240" class="w-full px-4 py-2 border border-earth-border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-earth-accent"/>
            </div>
            <div>
              <label class="block text-xs font-bold text-earth-primary mb-1">ค่าเช่าต่อวัน (฿/วัน)</label>
              <input type="number" id="input-rent-price" value="6" class="w-full px-4 py-2 border border-earth-border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-earth-accent"/>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-earth-primary mb-1">คำอธิบายหนังสือย่อ</label>
            <textarea id="input-desc" rows="3" placeholder="ระบุเรื่องย่อ หรือสภาพหนังสือเพิ่มเติม..." class="w-full px-4 py-2 border border-earth-border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-earth-accent"></textarea>
          </div>

          <button onclick="submitNewBook()" class="w-full py-3 bg-earth-primary text-white font-bold text-sm rounded-xl hover:bg-earth-accent transition shadow-md">
            💾 บันทึกและลงทะเบียนหนังสือ
          </button>
        </div>
      </div>
    </div>

  </main>

  <script>
    let booksData = [
      {
        id: 1, title: 'Atomic Habits (ฉบับแปลไทย)', author: 'James Clear',
        category: 'จิตวิทยา & พัฒนาตนเอง', buyPrice: 280, rentPrice: 7,
        img: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=600&q=80',
        desc: 'หนังสือระดับโลกที่จะเปลี่ยนความคิดและพฤติกรรมทีละ 1%', isMyBook: false
      }
    ];

    let currentCategory = 'ทั้งหมด';
    let uploadedImageBase64 = null;

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          uploadedImageBase64 = e.target.result;
          document.getElementById('uploaded-preview').src = uploadedImageBase64;
          document.getElementById('preview-box').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    function resetAddBookForm() {
      document.getElementById('input-title').value = '';
      document.getElementById('input-author').value = '';
      document.getElementById('input-desc').value = '';
      document.getElementById('file-input').value = '';
      document.getElementById('preview-box').classList.add('hidden');
      uploadedImageBase64 = null;
    }

    function submitNewBook() {
      const title = document.getElementById('input-title').value.trim();
      const author = document.getElementById('input-author').value.trim();
      const category = document.getElementById('input-category').value;
      const buyPrice = document.getElementById('input-buy-price').value || 200;
      const rentPrice = document.getElementById('input-rent-price').value || 5;
      const desc = document.getElementById('input-desc').value.trim() || 'หนังสือที่คุณลงทะเบียนเข้าระบบ';

      if (!title || !author) {
        alert('กรุณากรอกชื่อหนังสือและผู้แต่งให้เรียบร้อย');
        return;
      }

      const defaultImage = 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=600&q=80';

      const newBook = {
        id: Date.now(),
        title: title,
        author: author,
        category: category,
        buyPrice: Number(buyPrice),
        rentPrice: Number(rentPrice),
        img: uploadedImageBase64 || defaultImage,
        desc: desc,
        isMyBook: true
      };

      booksData.unshift(newBook);
      currentCategory = '📘 หนังสือของคุณ';
      
      resetAddBookForm();
      showView('home');
      alert(`ลงทะเบียนหนังสือ "${title}" เรียบร้อยแล้ว!`);
    }

    function renderCategoryPills() {
      const categories = ["ทั้งหมด", "📘 หนังสือของคุณ", "จิตวิทยา & พัฒนาตนเอง", "วรรณกรรม & นิยายแปล", "ธุรกิจ & การลงทุน"];
      const container = document.getElementById('category-pills');
      container.innerHTML = categories.map(cat => `
        <button onclick="setCategory('${cat}')" class="px-4 py-2 rounded-full text-xs font-bold transition ${currentCategory === cat ? 'bg-earth-primary text-white' : 'bg-white text-earth-primary border border-earth-border'}">
          ${cat}
        </button>
      `).join('');
    }

    function setCategory(cat) {
      currentCategory = cat;
      renderCategoryPills();
      renderBooks();
    }

    function renderBooks() {
      const grid = document.getElementById('book-grid');
      let filtered = booksData.filter(b => {
        if (currentCategory === '📘 หนังสือของคุณ') return b.isMyBook;
        if (currentCategory !== 'ทั้งหมด') return b.category === currentCategory;
        return true;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-4 text-center py-10 text-earth-muted">ไม่พบหนังสือในหมวดหมู่นี้</div>`;
        return;
      }

      grid.innerHTML = filtered.map(b => `
        <div class="bg-white rounded-2xl p-4 border border-earth-border shadow-sm flex flex-col justify-between space-y-3">
          <div class="relative">
            <img src="${b.img}" class="w-full h-48 object-cover rounded-xl"/>
            ${b.isMyBook ? `<span class="absolute top-2 left-2 bg-purple-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">📘 หนังสือของคุณ</span>` : ''}
          </div>
          <div>
            <span class="text-[10px] text-earth-muted">${b.category}</span>
            <h4 class="text-sm font-bold text-earth-primary line-clamp-1">${b.title}</h4>
            <p class="text-xs text-earth-muted">${b.author}</p>
          </div>
          <button onclick="openDetail(${b.id})" class="w-full py-2 bg-earth-bg border border-earth-border text-earth-primary text-xs font-bold rounded-xl hover:bg-earth-primary hover:text-white transition">
            ${b.isMyBook ? '🔍 ดูรายละเอียด' : '🔍 ดูรายละเอียด & สั่งซื้อ'}
          </button>
        </div>
      `).join('');
    }

    function openDetail(id) {
      const book = booksData.find(b => b.id === id);
      if (!book) return;

      document.getElementById('detail-img').src = book.img;
      document.getElementById('detail-title').innerText = book.title;
      document.getElementById('detail-author').innerText = book.author;
      document.getElementById('detail-desc').innerText = book.desc;

      const badge = document.getElementById('detail-badge');
      const actionContainer = document.getElementById('action-container');

      if (book.isMyBook) {
        badge.innerText = '📘 หนังสือของคุณ (แสดงผลอย่างเดียว)';
        badge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-purple-100 text-purple-700';
        actionContainer.innerHTML = `
          <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800 font-medium">
            🔒 หนังสือเล่มนี้เป็นหนังสือของคุณ สามารถเข้าดูรายละเอียดได้เท่านั้น ไม่สามารถกดสั่งซื้อหรือเช่าได้
          </div>
          <button disabled class="w-full mt-3 py-3 bg-gray-200 text-gray-500 font-bold text-xs rounded-xl cursor-not-allowed">
            🚫 ไม่สามารถสั่งซื้อหนังสือของตัวเองได้
          </button>
        `;
      } else {
        badge.innerText = '🟢 พร้อมให้ยืม/ซื้อ';
        badge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-earth-sage-light text-earth-sage-dark';
        actionContainer.innerHTML = `
          <button onclick="alert('เพิ่มลงตะกร้าเรียบร้อย')" class="w-full py-3 bg-earth-primary text-white font-bold text-xs rounded-xl hover:bg-earth-accent transition">
            🛒 เพิ่มลงในตะกร้าสินค้า
          </button>
        `;
      }

      showView('detail');
    }

    function showView(viewName) {
      document.getElementById('view-home').classList.add('hidden');
      document.getElementById('view-detail').classList.add('hidden');
      document.getElementById('view-seller-add').classList.add('hidden');

      if (viewName === 'seller-add') {
        resetAddBookForm();
        document.getElementById('view-seller-add').classList.remove('hidden');
      } else if (viewName === 'detail') {
        document.getElementById('view-detail').classList.remove('hidden');
      } else {
        renderCategoryPills();
        renderBooks();
        document.getElementById('view-home').classList.remove('hidden');
      }
    }

    // Init
    renderCategoryPills();
    renderBooks();
  </script>
</body>
</html>
